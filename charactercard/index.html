<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Character Card">
    <meta property="og:description" content="Character Card for Snortleblat">
    <meta property="og:url" content="https://jackdaddyton-ops.github.io/wdd131/charactercard/">
    <meta property="og:image" content="https://jackdaddyton-ops.github.io/wdd131/charactercard/images/snortleblat.webp">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Character Card">
    <meta name="twitter:description" content="Character Card for Snortleblat">
    <meta name="twitter:image"
        content="https://jackdaddyton-ops.github.io/wdd131/charactercard/images/snortleblat.webp">

    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="../images/snortleblat.webp">

    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="../images/snortleblat.webp">

    <title>Character Card</title>
    <link rel="stylesheet" href="charactercard.css">
    <script src="charactercard.js" defer></script>
</head>

<body>
    <section class="card">
        <img class="image" alt="Snortleblat" src="../images/snortleblat.webp">
        <h2 class="name">Snortleblat</h2>
        <section class="stats">
            <p>Class:</p>
            <p>Level:</p>
            <p>Health:</p>
        </section>
        <section class="buttons">
            <button>Attacked</button>
            <button>Level Up</button>
        </section>
    </section>
</body>

</html>
