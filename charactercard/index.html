<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Card</title>
    <link rel="stylesheet" href="charactercard.css">
    <script src="charactercard.js" defer></script>
</head>

<body>
    <section class="card">
        <img class="image" alt="Snortleblat" src="../images/snortleblat.webp">
        <h2 class="name">Snortleblat</h2>
        <section class="stats">
            <p>Class:</p>
            <p>Level:</p>
            <p>Health:</p>
        </section>
        <section class="buttons">
            <button>Attacked</button>
            <button>Level Up</button>
        </section>
    </section>
</body>

</html>
